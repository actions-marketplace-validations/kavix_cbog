name: Feature Request
description: Suggest an idea or feature for this project
title: "[Feature]: "
labels: ["kind/feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: A clear and concise description of the problem this feature solves.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you would like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you have considered.
