name: Stale Triage

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Mark Stale Issues & PRs
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 90
          days-before-issue-close: 14
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity in 90 days. It will be closed in 14 days if no further activity occurs. If this issue is still relevant, please leave a comment to keep it active.'
          close-issue-message: 'This issue was closed because it has been inactive for 14 days since being marked as stale.'
          stale-issue-label: 'lifecycle/stale'
          exempt-issue-labels: 'lifecycle/frozen,pinned,security'
          days-before-pr-stale: 90
          days-before-pr-close: 14
          stale-pr-message: 'This pull request has been automatically marked as stale because it has not had recent activity in 90 days. It will be closed in 14 days if no further activity occurs. If this contribution is still active, please push an update or comment to keep it open.'
          close-pr-message: 'This pull request was closed because it has been inactive for 14 days since being marked as stale.'
          stale-pr-label: 'lifecycle/stale'
          exempt-pr-labels: 'lifecycle/frozen,work-in-progress'
