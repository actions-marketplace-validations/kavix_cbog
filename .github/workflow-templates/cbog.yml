name: cbog Open-Source Helper

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (bot or scaffold-oss-docs)'
        required: true
        default: 'bot'
        type: choice
        options:
          - bot
          - scaffold-oss-docs

jobs:
  cbog:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      statuses: write
      checks: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run cbog
        uses: kavix/cbog@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: ${{ inputs.mode || 'bot' }}
