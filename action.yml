name: 'Community Bot for Open-source Governance (cbog)'
description: 'Enterprise open-source triage bot with slash commands, contributor claiming, PR sizing, and governance scaffolding'
author: 'kavix'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub Token with issues, pull-requests, statuses, and contents write permissions'
    required: true
    default: ${{ github.token }}
  mode:
    description: 'Execution mode: bot (event processing) or scaffold-oss-docs (generates community guidelines PR)'
  license:
    description: 'Open source license to generate: mit, apache-2.0, bsd-3-clause, gpl-3.0, mpl-2.0'
    required: false
    default: 'mit'
  bot-name:
    description: 'Custom display name for the bot (e.g. k8s-ci-robot, cbog)'
    required: false
    default: 'cbog'
  bot-icon-url:
    description: 'Custom icon URL (.ico or image) for bot branding'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Run cbog
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_LICENSE: ${{ inputs.license }}
        INPUT_BOT_NAME: ${{ inputs.bot-name }}
        INPUT_BOT_ICON_URL: ${{ inputs.bot-icon-url }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        BIN="${GITHUB_ACTION_PATH}/bin/cbog-${OS}-${ARCH}"
        if [ -f "$BIN" ]; then
          chmod +x "$BIN"
          "$BIN"
        elif [ -f "${GITHUB_ACTION_PATH}/bin/cbog" ]; then
          chmod +x "${GITHUB_ACTION_PATH}/bin/cbog"
          "${GITHUB_ACTION_PATH}/bin/cbog"
        else
          echo "Running cbog from source with go run..."
          go run "${GITHUB_ACTION_PATH}/cmd/bot/main.go"
        fi
